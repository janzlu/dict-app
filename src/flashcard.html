<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flashcard</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="flashcard.css">
<body style="background: transparent !important; background-color: transparent !important;">
    <div class="flashcard" id="card">
        <button class="dock-btn" id="dockBtn">
            <span class="normal-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"/>
                    <path d="M15 3v18M10 9l3 3-3 3"/>
                </svg>
            </span>
            <span class="docked-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="sparkle-svg">
                    <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z"/>
                    <circle cx="12" cy="12" r="2.5" fill="#00d2ff"/>
                </svg>
            </span>
        </button>

        <button class="close-btn" id="closeBtn">X</button>
        
        <div class="word" id="wordBox">hello</div>
        <div class="phonetic" id="phoneticBox">/həˈləʊ/</div>
        <div class="translation" id="transBox">int. 喂；哈罗</div>
        
        <div class="buttons" id="btnGroup">
            <button class="btn forgot" data-score="1">忘记 (4)</button>
            <button class="btn hard" data-score="2">困难 (3)</button>
            <button class="btn good" data-score="3">良好 (2)</button>
            <button class="btn easy" data-score="4">简单 (1)</button>
        </div>
    </div>
    
    <script src="flashcard.js"></script>
</body>
</html>
