<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lumina Spotlight</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="spotlight-container">
        <button id="closeBtn" class="spotlight-close-btn">&times;</button>
        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Type a word, or paste / drop image..." autocomplete="off" spellcheck="false" autofocus>
            <button id="uploadImageBtn" class="search-action-btn" title="选择本地图片提取文字 / Open Image to Extract Text">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </button>
            <button id="screenshotBtn" class="search-action-btn" title="Screenshot Translate / 截图翻译 (Cmd+Shift+X)">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                    <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                    <rect x="7" y="7" width="10" height="10" rx="1"></rect>
                </svg>
            </button>
        </div>
        
        <div id="resultArea" class="result-area">
            <div class="word-header">
                <div id="wordPhonetic" class="word-phonetic" title="Click to listen"></div>
                <div id="screenshotThumbnailContainer" class="thumbnail-container" style="display: none; margin-left: auto;">
                    <img id="screenshotThumbnail" class="screenshot-thumbnail" alt="Screenshot Thumbnail" title="点击查看大图 / Click to view original">
                    <button id="btnThumbCopyText" class="thumb-mini-btn" title="复制识别文字">📝</button>
                    <button id="btnThumbCopy" class="thumb-mini-btn" title="复制截图到剪贴板">📋</button>
                    <button id="btnThumbSave" class="thumb-mini-btn" title="保存截图至本地">💾</button>
                </div>
            </div>
            <div id="wordDefinition" class="word-definition"></div>
            <button id="saveWordBtn" class="save-word-btn">加入生词本</button>
        </div>
    </div>
    
    <div id="toast" class="toast">Added to Wordbook</div>

    <!-- Lightbox Modal for Original Screenshot -->
    <div id="imageLightbox" class="lightbox-modal" style="display: none;">
        <span id="lightboxClose" class="lightbox-close">&times;</span>
        <img id="lightboxImage" class="lightbox-content" alt="Original Screenshot">
        <div class="lightbox-toolbar">
            <button id="lightboxCopyTextBtn" class="lightbox-btn">📝 复制文字</button>
            <button id="lightboxCopyBtn" class="lightbox-btn">📋 复制图片</button>
            <button id="lightboxSaveBtn" class="lightbox-btn">💾 保存原图</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
