<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lumina Spotlight</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="spotlight-container">
        <button id="closeBtn" class="spotlight-close-btn">&times;</button>
        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Type a word..." autocomplete="off" spellcheck="false" autofocus>
        </div>
        
        <div id="resultArea" class="result-area">
            <div class="word-header">
                <div id="wordPhonetic" class="word-phonetic" title="Click to listen"></div>
            </div>
            <div id="wordDefinition" class="word-definition"></div>
            <button id="saveWordBtn" class="save-word-btn">加入生词本</button>
        </div>
    </div>
    
    <div id="toast" class="toast">Added to Wordbook</div>

    <script src="app.js"></script>
</body>
</html>
